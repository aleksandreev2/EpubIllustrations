name: Windows release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, for example v1.0.0
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Verify version tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: node -e "if ('v'+require('./package.json').version !== process.env.RELEASE_TAG) process.exit(1)"
      - run: npm ci
      - run: npm test
      - run: npm run dist -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - run: npm run checksums
      - name: Publish release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release view $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG --verify-tag --title "Иллюстрации EPUB $env:RELEASE_TAG" --generate-notes
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $assets = @(Get-ChildItem -LiteralPath dist -Filter '*.exe' -File | ForEach-Object FullName)
          $assets += (Resolve-Path 'dist/SHA256SUMS.txt').Path
          gh release upload $env:RELEASE_TAG @assets --clobber
